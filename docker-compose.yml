services:
  db:
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar_precio"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar_precio
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["radar_postgres:/var/lib/postgresql/data"]
volumes:
  radar_postgres:
